<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020b14;
      font-family: 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }

    /* Scale 1920×1080 composition to fit any container */
    #stage-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #020b14;
      overflow: hidden;
    }
    #stage {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      transform: translate(-50%, -50%);
      overflow: hidden;
    }

    /* Grid */
    #grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,188,212,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,188,212,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    #scanlines {
      position: absolute; inset: 0; z-index: 100; pointer-events: none;
      background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);
    }

    /* Scenes */
    .scene {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
    }
    .scene.active { pointer-events: auto; }

    /* Scene 1 */
    #scene1 { flex-direction: column; gap: 40px; }
    #s1-icon { font-size: 160px; filter: drop-shadow(0 0 40px #ff1744); }
    #s1-text { font-size: 72px; font-weight: 700; color: #ff1744; text-shadow: 0 0 30px rgba(255,23,68,0.8); letter-spacing: 0.02em; }
    #s1-sub  { font-size: 36px; color: rgba(255,255,255,0.6); letter-spacing: 0.05em; }

    /* Scene 2 */
    #scene2 { flex-direction: column; gap: 60px; }
    #tunnel-wrap { position: relative; width: 1400px; height: 200px; }
    #tunnel-bg {
      position: absolute; inset: 0;
      border: 2px solid rgba(0,188,212,0.4); border-radius: 100px;
      background: linear-gradient(90deg,rgba(0,188,212,0.05),rgba(0,188,212,0.15),rgba(0,188,212,0.05));
      box-shadow: inset 0 0 40px rgba(0,188,212,0.1), 0 0 40px rgba(0,188,212,0.2);
    }
    .pc-node,.vpn-node {
      position: absolute; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .pc-node { left: -120px; } .vpn-node { right: -120px; }
    .node-icon { font-size: 80px; } .node-label { font-size: 24px; color: rgba(255,255,255,0.7); font-weight: 600; }
    .vpn-node .node-icon { filter: drop-shadow(0 0 20px #00bcd4); }
    #packets { position: absolute; inset: 0; overflow: hidden; border-radius: 100px; }
    .packet { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
    #s2-label { font-size: 48px; font-weight: 700; color: #00bcd4; text-shadow: 0 0 20px rgba(0,188,212,0.8); letter-spacing: 0.1em; }
    #s2-sub   { font-size: 28px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; margin-top: -30px; }

    /* Scene 3 */
    #scene3 { flex-direction: column; gap: 40px; }
    #s3-shield-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    #s3-shield { font-size: 200px; filter: drop-shadow(0 0 60px #00bcd4); }
    #s3-check  { position: absolute; font-size: 100px; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0; }
    #s3-title  { font-size: 80px; font-weight: 800; color: #00e5ff; text-shadow: 0 0 40px rgba(0,229,255,0.6); letter-spacing: 0.05em; }
    #s3-sub    { font-size: 36px; color: rgba(255,255,255,0.6); letter-spacing: 0.02em; }
    #s3-features { display: flex; gap: 60px; margin-top: 10px; }
    .feature { display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; transform: translateY(20px); }
    .feature-icon { font-size: 48px; } .feature-text { font-size: 24px; color: rgba(255,255,255,0.7); font-weight: 600; }

    /* Scene 4 — CTA with clickable button */
    #scene4 { flex-direction: column; gap: 50px; }
    #s4-ghost { font-size: 150px; filter: drop-shadow(0 0 30px rgba(0,188,212,0.6)); }
    #s4-bubble {
      background: rgba(0,188,212,0.1); border: 2px solid #00bcd4;
      border-radius: 24px; padding: 40px 80px; text-align: center;
      box-shadow: 0 0 40px rgba(0,188,212,0.2); opacity: 0;
    }
    #s4-main { font-size: 64px; font-weight: 800; color: #ffffff; letter-spacing: 0.02em; margin-bottom: 24px; }

    /* ★ Real clickable CTA button */
    #s4-btn {
      display: inline-block;
      background: linear-gradient(135deg, #00bcd4, #00838f);
      color: #ffffff;
      font-size: 40px;
      font-weight: 800;
      padding: 24px 80px;
      border-radius: 100px;
      text-decoration: none;
      letter-spacing: 0.05em;
      box-shadow: 0 0 40px rgba(0,188,212,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    #s4-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(0,188,212,0.8);
    }
    #s4-discount {
      display: inline-block; background: #ff6d00; color: white;
      font-size: 28px; font-weight: 800; padding: 8px 28px;
      border-radius: 100px; margin-top: 24px;
    }

    /* Replay button (appears after video ends) */
    #replay-btn {
      position: absolute; bottom: 40px; right: 60px;
      background: rgba(0,188,212,0.2); border: 2px solid #00bcd4;
      color: #00bcd4; font-size: 24px; font-weight: 700;
      padding: 14px 36px; border-radius: 100px; cursor: pointer;
      opacity: 0; z-index: 200; pointer-events: none;
      font-family: inherit; letter-spacing: 0.05em;
    }
    #replay-btn:hover { background: rgba(0,188,212,0.4); }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <div id="stage">
      <div id="grid"></div>
      <div id="scanlines"></div>

      <!-- Scene 1 -->
      <div id="scene1" class="scene">
        <div id="s1-icon">⚠️</div>
        <div id="s1-text">あなたの通信は丸見えです</div>
        <div id="s1-sub">公共Wi-Fi・フリーWi-Fiは盗聴リスクがあります</div>
      </div>

      <!-- Scene 2 -->
      <div id="scene2" class="scene">
        <div id="tunnel-wrap">
          <div id="tunnel-bg"></div>
          <div id="packets"></div>
          <div class="pc-node"><div class="node-icon">💻</div><div class="node-label">あなた</div></div>
          <div class="vpn-node"><div class="node-icon">🛡️</div><div class="node-label">NordVPN</div></div>
        </div>
        <div id="s2-label">AES-256 暗号化トンネル</div>
        <div id="s2-sub">軍事レベルの暗号化で通信を完全保護</div>
      </div>

      <!-- Scene 3 -->
      <div id="scene3" class="scene">
        <div id="s3-shield-wrap">
          <div id="s3-shield">🛡️</div>
          <div id="s3-check">✅</div>
        </div>
        <div id="s3-title">完全保護完了</div>
        <div id="s3-sub">第三者監査済みゼロログ・7,000台以上のサーバー</div>
        <div id="s3-features">
          <div class="feature" id="f1"><div class="feature-icon">🔒</div><div class="feature-text">ゼロログ</div></div>
          <div class="feature" id="f2"><div class="feature-icon">⚡</div><div class="feature-text">超高速</div></div>
          <div class="feature" id="f3"><div class="feature-icon">🌍</div><div class="feature-text">111カ国</div></div>
          <div class="feature" id="f4"><div class="feature-icon">🖥️</div><div class="feature-text">10台同時</div></div>
        </div>
      </div>

      <!-- Scene 4: CTA with real button -->
      <div id="scene4" class="scene">
        <div id="s4-ghost">👻</div>
        <div id="s4-bubble">
          <div id="s4-main">NordVPN で今すぐ守る</div>
          <a id="s4-btn"
             href="https://px.a8.net/svt/ejp?a8mat=4BCGFP+FSL7ZE+3YFI+5YJRM"
             target="_blank"
             rel="nofollow noopener">
            👉 公式サイトで確認する
          </a>
          <div id="s4-discount">現在 72% OFF 実施中</div>
        </div>
      </div>

      <!-- Replay -->
      <button id="replay-btn" onclick="replayAnimation()">▶ もう一度見る</button>
    </div>
  </div>

  <script>
    // ── Scale stage to fit container ──
    function scaleStage() {
      const wrap  = document.getElementById('stage-wrap');
      const stage = document.getElementById('stage');
      const scale = Math.min(wrap.clientWidth / 1920, wrap.clientHeight / 1080);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    scaleStage();
    window.addEventListener('resize', scaleStage);

    // ── Seeded PRNG ──
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(42);

    // ── Pre-calculate packet positions ──
    const PACKETS = [];
    for (let t = 4.5; t < 8.5; t += 0.35) {
      PACKETS.push({ t, isLock: rand() > 0.4, topPct: 20 + rand() * 60 });
    }

    const packetsEl = document.getElementById('packets');
    const replayBtn = document.getElementById('replay-btn');
    let spawnIdx = 0;

    function buildTimeline() {
      spawnIdx = 0;
      const tl = gsap.timeline({
        onComplete: () => {
          gsap.to(replayBtn, { opacity: 1, duration: 0.4 });
          replayBtn.style.pointerEvents = 'auto';
          document.getElementById('scene4').classList.add('active');
        }
      });

      // Scene 1
      tl.fromTo('#scene1', { opacity:0 }, { opacity:1, duration:0.5 }, 0);
      tl.fromTo('#s1-icon', { scale:0, rotation:-20 }, { scale:1, rotation:0, duration:0.6, ease:'back.out(1.5)' }, 0.1);
      tl.fromTo('#s1-text', { opacity:0, y:30 }, { opacity:1, y:0, duration:0.5 }, 0.4);
      tl.fromTo('#s1-sub',  { opacity:0, y:20 }, { opacity:1, y:0, duration:0.5 }, 0.7);
      tl.to('#s1-text', { textShadow:'0 0 60px rgba(255,23,68,1)', duration:0.15, yoyo:true, repeat:3 }, 1.5);
      tl.to('#scene1', { opacity:0, duration:0.4 }, 3.6);

      // Scene 2
      tl.fromTo('#scene2', { opacity:0 }, { opacity:1, duration:0.5 }, 4);
      tl.fromTo('#tunnel-wrap', { scaleX:0 }, { scaleX:1, duration:0.6, ease:'power2.out' }, 4.2);
      tl.fromTo('.pc-node',  { opacity:0, x:-40 }, { opacity:1, x:0, duration:0.4 }, 4.5);
      tl.fromTo('.vpn-node', { opacity:0, x: 40 }, { opacity:1, x:0, duration:0.4 }, 4.5);
      tl.fromTo('#s2-label', { opacity:0, y:20 }, { opacity:1, y:0, duration:0.5 }, 5);
      tl.fromTo('#s2-sub',   { opacity:0 },        { opacity:1, duration:0.4 },      5.4);
      tl.to('#scene2', { opacity:0, duration:0.4 }, 8.6);

      // Scene 3
      tl.fromTo('#scene3', { opacity:0 }, { opacity:1, duration:0.5 }, 9);
      tl.fromTo('#s3-shield', { scale:0, rotation:-30 }, { scale:1, rotation:0, duration:0.7, ease:'back.out(1.7)' }, 9.2);
      tl.fromTo('#s3-check',  { opacity:0, scale:0 },    { opacity:1, scale:1,  duration:0.4, ease:'back.out(2)'   }, 9.8);
      tl.fromTo('#s3-title',  { opacity:0, y:30 }, { opacity:1, y:0, duration:0.5 }, 9.5);
      tl.fromTo('#s3-sub',    { opacity:0 },        { opacity:1, duration:0.4 },      9.9);
      tl.to('#f1', { opacity:1, y:0, duration:0.3 }, 10.2);
      tl.to('#f2', { opacity:1, y:0, duration:0.3 }, 10.4);
      tl.to('#f3', { opacity:1, y:0, duration:0.3 }, 10.6);
      tl.to('#f4', { opacity:1, y:0, duration:0.3 }, 10.8);
      tl.to('#scene3', { opacity:0, duration:0.4 }, 12.6);

      // Scene 4
      tl.fromTo('#scene4',   { opacity:0 },         { opacity:1, duration:0.5 },                                     13);
      tl.fromTo('#s4-ghost', { y:-40, opacity:0 },  { y:0, opacity:1, duration:0.6, ease:'bounce.out' },            13.2);
      tl.to('#s4-bubble',    { opacity:1, duration:0.5, ease:'power2.out' },                                          13.8);
      tl.fromTo('#s4-main',  { opacity:0, y:20 }, { opacity:1, y:0, duration:0.4 },                                 14);
      tl.fromTo('#s4-btn',   { opacity:0, scale:0.8 }, { opacity:1, scale:1, duration:0.5, ease:'back.out(2)' },    14.3);
      tl.fromTo('#s4-discount', { opacity:0, scale:0.5 }, { opacity:1, scale:1, duration:0.4, ease:'back.out(2)' }, 14.8);
      tl.to('#s4-ghost', { y:-15, duration:1.2, yoyo:true, repeat:1, ease:'sine.inOut' }, 14);

      // Packet spawner
      tl.eventCallback('onUpdate', () => {
        const now = tl.time();
        while (spawnIdx < PACKETS.length && PACKETS[spawnIdx].t <= now) {
          const cfg = PACKETS[spawnIdx++];
          if (now - cfg.t > 0.5) continue;
          const p = document.createElement('div');
          p.className = 'packet';
          p.textContent = cfg.isLock ? '🔒' : '●';
          p.style.cssText = `background:${cfg.isLock?'rgba(0,188,212,0.3)':'rgba(255,100,100,0.3)'};border:2px solid ${cfg.isLock?'#00bcd4':'#ff5252'};color:${cfg.isLock?'#00e5ff':'#ff5252'};left:-50px;top:${cfg.topPct}%`;
          packetsEl.appendChild(p);
          gsap.fromTo(p, { x:0, opacity:1 }, { x:1500, opacity:0.8, duration:1.2, ease:'none', onComplete:()=>p.remove() });
        }
      });

      return tl;
    }

    let currentTl = buildTimeline();

    function replayAnimation() {
      gsap.to(replayBtn, { opacity:0, duration:0.2 });
      replayBtn.style.pointerEvents = 'none';
      packetsEl.innerHTML = '';
      gsap.set('.scene', { opacity:0 });
      gsap.set('#s3-check', { opacity:0, scale:0 });
      gsap.set('.feature', { opacity:0, y:20 });
      gsap.set('#s4-bubble', { opacity:0 });
      gsap.set('#s4-btn', { opacity:0, scale:0.8 });
      gsap.set('#s4-discount', { opacity:0, scale:0.5 });
      if (currentTl) currentTl.kill();
      currentTl = buildTimeline();
    }
  </script>
</body>
</html>
